<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report a problem</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1d2733; }
  header { background: #0b5ed7; color: #fff; padding: 14px 16px; }
  header h1 { margin: 0; font-size: 18px; }
  main { max-width: 560px; margin: 0 auto; padding: 14px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: 14px; }
  textarea, select, input { width: 100%; padding: 10px; font-size: 16px;
    border: 1px solid #c5cdd6; border-radius: 8px; background: #fff; }
  textarea { min-height: 90px; resize: vertical; }
  #map { height: 300px; border-radius: 8px; border: 1px solid #9fb0c0; background: #dfe7ee; }
  .note { font-size: 12px; color: #55606b; margin-top: 4px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  button { font-size: 16px; padding: 12px; border: 0; border-radius: 8px; cursor: pointer; }
  .secondary { background: #e3e8ee; white-space: nowrap; }
  .primary { background: #0b5ed7; color: #fff; width: 100%; margin-top: 18px; font-weight: 600; }
  .primary:disabled { opacity: .6; }
  .msg { margin-top: 14px; padding: 12px; border-radius: 8px; display: none; }
  .ok { background: #d7f5df; } .err { background: #fde0e0; }
  .code { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
</style>
</head>
<body>
<header><h1>Report a problem</h1><a href="/track.html" style="color:#fff;font-size:14px">Track a report</a></header>
<main>
  <form id="form">
    <label for="text">What is the problem?</label>
    <textarea id="text" required placeholder="e.g. Drain blocked near the bus stop, water on the road"></textarea>

    <label for="category">Category</label>
    <select id="category"><option value="auto">Not sure (let the system decide)</option></select>

    <label>Location (tap the map to drop a pin)</label>
    <div id="map"></div>
    <div class="note" id="mapnote">Grey dots are existing reports.</div>
    <div class="row">
      <input id="latIn" placeholder="Latitude" inputmode="decimal">
      <input id="lngIn" placeholder="Longitude" inputmode="decimal">
    </div>
    <div class="row">
      <button type="button" class="secondary" id="locate">Use my location</button>
      <span class="note" id="coords">No location yet</span>
    </div>

    <label for="image">Photo (optional)</label>
    <input type="file" id="image" accept="image/*" capture="environment">

    <button class="primary" id="submit" type="submit">Submit report</button>
  </form>
  <div class="msg" id="msg"></div>
</main>

<script src="/vendor/leaflet.js"></script>
<script>
  const map = L.map('map').setView([12.935, 77.62], 14);
  const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(map);

  let tileErrors = 0;
  tiles.on('tileerror', () => {
    if (++tileErrors === 3) {
      document.getElementById('mapnote').textContent =
        'Street tiles are blocked on this network, so the background is plain. Pins and coordinates still work.';
    }
  });

  let pin = null, lat = null, lng = null;
  function setPin(a, b, pan) {
    lat = a; lng = b;
    if (pin) pin.setLatLng([a, b]);
    else pin = L.circleMarker([a, b], { radius: 10, color: '#d32f2f', fillColor: '#d32f2f', fillOpacity: 0.85 }).addTo(map);
    if (pan) map.setView([a, b], 17);
    document.getElementById('coords').textContent = a.toFixed(5) + ', ' + b.toFixed(5);
    document.getElementById('latIn').value = a.toFixed(5);
    document.getElementById('lngIn').value = b.toFixed(5);
  }
  map.on('click', e => setPin(e.latlng.lat, e.latlng.lng, false));

  function fromBoxes() {
    const a = parseFloat(document.getElementById('latIn').value);
    const b = parseFloat(document.getElementById('lngIn').value);
    if (!isNaN(a) && !isNaN(b)) setPin(a, b, true);
  }
  document.getElementById('latIn').addEventListener('change', fromBoxes);
  document.getElementById('lngIn').addEventListener('change', fromBoxes);

  document.getElementById('locate').onclick = () => {
    if (!navigator.geolocation) return alert('Location is not available on this device.');
    navigator.geolocation.getCurrentPosition(
      p => setPin(p.coords.latitude, p.coords.longitude, true),
      () => alert('Could not get your location. Tap the map instead.'));
  };

  // Existing reports as grey dots
  fetch('/api/reports').then(r => r.json()).then(list => {
    list.forEach(rep => L.circleMarker([rep.lat, rep.lng],
      { radius: 5, color: '#6b7a89', fillColor: '#6b7a89', fillOpacity: 0.6, interactive: false }).addTo(map));
  });

  fetch('/api/categories').then(r => r.json()).then(list => {
    const sel = document.getElementById('category');
    list.forEach(c => { const o = document.createElement('option'); o.value = o.textContent = c; sel.appendChild(o); });
  });

  const msg = document.getElementById('msg');
  function show(html, ok) { msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.innerHTML = html; msg.style.display = 'block'; }

  document.getElementById('form').onsubmit = async e => {
    e.preventDefault();
    if (lat === null) return show('Please tap the map or enter coordinates first.', false);
    const fd = new FormData();
    fd.append('text', document.getElementById('text').value);
    fd.append('category', document.getElementById('category').value);
    fd.append('lat', lat); fd.append('lng', lng);
    const img = document.getElementById('image').files[0];
    if (img) fd.append('image', img);

    const btn = document.getElementById('submit');
    btn.disabled = true; btn.textContent = 'Submitting...';
    try {
      const res = await fetch('/api/reports', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Something went wrong');
            const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      show('Report received. Your tracking code:<div class="code">' + esc(data.tracking_code) + '</div>' +
        '<p><b>Category:</b> ' + esc(data.category) + ' (' + esc(data.ai_source) + ', confidence ' + Math.round(data.category_confidence * 100) + '%)</p>' +
        '<p><b>Summary:</b> ' + esc(data.summary) + '</p>' +
        '<p><b>Duplicate check:</b> ' + esc(data.duplicate_note) + '</p>' +
        '<p><b>Priority:</b> ' + data.priority_score + '/100</p>' +
        '<p>' + esc(data.priority_explanation) + '</p>', true);
      document.getElementById('form').reset();
      if (pin) { map.removeLayer(pin); pin = null; }
      lat = lng = null;
      document.getElementById('coords').textContent = 'No location yet';
    } catch (err) {
      show(err.message, false);
    } finally {
      btn.disabled = false; btn.textContent = 'Submit report';
    }
  };
</script>
</body>
</html>
